<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f1" />
    <meta
      name="description"
      content="캐피탈(여신전문금융)의 구조를 개념과 확인 문제로 배우고, 상환 스케줄·심사·중도상환 계산기와 가상 시계로 움직이는 모의 여신으로 대출의 생애를 직접 따라가 보는 교육용 서비스입니다. 실제 대출을 취급하지 않습니다."
    />
    <!--
      검색·공유 기본 메타(WP39). 자바스크립트를 돌리지 않는 수집기는 이 값만 본다. 화면별 값은 components/PageTitle.tsx 가 라우트마다 바꾼다.
      절대 주소가 필요한 canonical·og:url·og:image 는 빌드 때 VITE_SITE_URL 이 있으면 vite.config.ts(seoFiles)가 넣는다. 실제 도메인을 여기에 적지 않는다.
    -->
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="CapiMATE" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="여신을 배우는 모의 캐피탈 · CapiMATE" />
    <meta
      property="og:description"
      content="캐피탈(여신전문금융)의 구조를 개념과 확인 문제로 배우고, 계산기와 가상 시계로 움직이는 모의 여신으로 대출의 생애를 따라가 보는 교육용 서비스입니다. 실제 대출을 취급하지 않습니다."
    />
    <meta property="og:image:alt" content="장부와 계산기가 놓인 상담 책상 장면 일러스트" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      본문 폰트 눈누 기초고딕(NoonnuBasicGothic)은 사람이 라이선스를 확인한 뒤 public/fonts/NoonnuBasicGothicRegular.woff2 로 넣는다.
      파일을 넣었으면 아래 preload 주석을 풀어 첫 그림에서 글꼴이 바뀌는 것을 줄인다. 파일이 없으면 base.css의 시스템 폰트로 자연스럽게 떨어진다.
      <link rel="preload" href="/fonts/NoonnuBasicGothicRegular.woff2" as="font" type="font/woff2" crossorigin />
    -->
    <title>여신을 배우는 모의 캐피탈 · CapiMATE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
